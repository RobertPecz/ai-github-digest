name: Weekly AI GitHub digest
on:
  schedule:
    - cron: '17 9 * * 5'
      timezone: Europe/Budapest
  workflow_dispatch:
    inputs:
      force_fallback:
        description: 'Skip Gemini and generate a Python-only report'
        type: boolean
        default: false
        required: false
      dry_run:
        description: 'Generate reports without sending Gmail'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: weekly-ai-github-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Generate report and send Gmail
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          FORCE_FALLBACK: ${{ inputs.force_fallback || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EMAIL_FROM: rob.pecz@gmail.com
          EMAIL_TO: rob.pecz@gmail.com
        run: python scripts/digest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-github-digest-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
